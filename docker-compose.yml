services:
  db:
    image: postgres:16-alpine
    container_name: poulailler-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poulailler}
      POSTGRES_USER: ${POSTGRES_USER:-poulailler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poulailler_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-poulailler} -d ${POSTGRES_DB:-poulailler}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
